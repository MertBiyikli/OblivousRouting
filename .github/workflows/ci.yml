name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  ORTOOLS_IMAGE: ghcr.io/mertbiyikli/ortools:linux

jobs:
  linux-matrix:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug + Tests + OpenMP
            configure_preset: debug-tests
            build_preset: debug-tests
            test_preset: debug
            run_tests: true

          - name: Release + Tests + OpenMP
            configure_preset: release-tests
            build_preset: release-tests
            test_preset: release
            run_tests: true

          - name: Debug / No OpenMP
            configure_preset: debug-no-openmp
            build_preset: debug-no-openmp
            run_tests: false

          - name: RelWithDebInfo
            configure_preset: relwithdebinfo
            build_preset: relwithdebinfo
            run_tests: false

    container:
      image: ${{ env.ORTOOLS_IMAGE }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_preset }}

      - name: Run tests
        if: matrix.run_tests
        run: ctest --preset ${{ matrix.test_preset }} --output-on-failure

  package-linux:
    name: Package Linux Release Binary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: linux-matrix

    container:
      image: ${{ env.ORTOOLS_IMAGE }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure release
        run: cmake --preset release

      - name: Build release
        run: cmake --build --preset release

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: oblivious-routing-linux
          path: build/release/oblivious_routing
          if-no-files-found: error
          retention-days: 7
