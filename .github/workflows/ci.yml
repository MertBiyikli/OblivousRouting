name: Linux CI

on:
  push:
    branches: [ master, prio_one, parallel ]
  pull_request:

permissions:
  contents: read
  packages: read

env:
  ORTOOLS_IMAGE: ghcr.io/mertbiyikli/ortools:linux
  BUILD_DIR: build

jobs:
  ##################################################################
  # 1. Build
  ##################################################################
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/mertbiyikli/ortools:linux
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S . -B $BUILD_DIR -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON

      - name: Build project
        run: |
          cmake --build $BUILD_DIR -j$(nproc)

      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-dir
          path: ${{ env.BUILD_DIR }}
          retention-days: 1

  ##################################################################
  # 2. Test
  ##################################################################
  test-linux:
    name: Test Linux
    runs-on: ubuntu-latest
    needs: build-linux

    container:
      image: ghcr.io/mertbiyikli/ortools:linux
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: linux-build-dir
          path: ${{ env.BUILD_DIR }}

      - name: Restore executable permissions
        run: |
          chmod -R u+x $BUILD_DIR

      - name: Run tests
        run: |
          cmake --build $BUILD_DIR --target run_tests

  ##################################################################
  # 3. Package artifact
  ##################################################################
  package-linux:
    name: Package Linux Binary
    runs-on: ubuntu-latest
    needs: test-linux

    steps:
      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: linux-build-dir
          path: ${{ env.BUILD_DIR }}

      - name: Restore executable permissions
        run: |
          chmod -R u+x $BUILD_DIR

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: oblivious-routing-linux
          path: ${{ env.BUILD_DIR }}/oblivious_routing