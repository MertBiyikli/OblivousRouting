name: Linux CI

on:
  push:
    branches: [ master, prio_one ]
  pull_request:

permissions:
  contents: read
  packages: read

env:
  ORTOOLS_IMAGE: ghcr.io/mertbiyikli/ortools:linux

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull OR-Tools image
        run: docker pull $ORTOOLS_IMAGE

      - name: Build inside OR-Tools image
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            $ORTOOLS_IMAGE \
            bash -c "
              cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_TESTS=ON &&
              cmake --build build -j\$(nproc) &&
              cmake --build build --target run_tests
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oblivious-routing-linux
          path: build/oblivious_routing