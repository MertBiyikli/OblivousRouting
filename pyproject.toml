
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "e-routing"
version = "0.1.0"
description = "Network resilience and capacity planning engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jsonschema",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["e_routing*"]

[tool.pytest.ini_options]
testpaths = ["tests/py"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
